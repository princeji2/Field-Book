spring.application.name=certificate-service
server.port=8081

# Supabase connection settings. Both values MUST be provided at runtime via
# environment variables - never hardcoded here. The empty defaults keep the
# Spring context loadable for tests; requests that need Supabase will fail
# fast with a clear error if either value is missing.
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}

# Optional overrides - defaults match the schema/bucket names in the project.
supabase.certificates-bucket=${SUPABASE_CERTIFICATES_BUCKET:certificates}
supabase.templates-table=${SUPABASE_TEMPLATES_TABLE:certificate_templates}
